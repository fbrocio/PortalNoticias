{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
  <link rel="stylesheet" href="{% static 'noticias/styles.css' %}">
</head>
<body>
  <div class="portal">
    <h1 class="portal-title">PORTAL DE NOTICIAS</h1>

    {% for video in videos %}
    <article class="news-card">
      <header class="news-header">
        <span class="news-date">{{ video.fecha|date:"d-m-Y" }}</span>
        <span class="news-title-header">{{ video.titulo_sin_autor }}</span>
      </header>
      <div class="news-body">
        <h2><a href="{{ video.url }}" target="_blank">Por: {{ video.canal }}</a></h2>

        {% for resumen in video.resumen_set.all %}
          <p class="news-preview">{{ resumen.resumen_texto }}</p>
          <button class="btn-leer-mas">▼ Leer más</button>
        {% endfor %}

      </div>
    </article>
    {% endfor %}

  </div>
  <script src="{% static 'noticias/index.js' %}"></script>
</body>
</html>
